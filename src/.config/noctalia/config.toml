[include]
files = [
    "bar.toml"
]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 196.0
box_width = 810.0
cx = 1280.0
cy = 1258.0
output = "eDP-1"
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[shell]
panel_anchor_bar = "default"

    [shell.panel]
    floating_layer = "top"
    
    [shell.shadow]
    alpha = 0.60999998636543751

[theme]
builtin = "Catppuccin"
community_palette = "ADW"
mode = "dark"
shell_mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"

[wallpaper.default]
path = "/home/elisa/Pictures/Wallpapers/wallhaven-po8ow9_2560x1440.png"

[wallpaper.last]
path = "/home/elisa/Pictures/Wallpapers/wallhaven-po8ow9_2560x1440.png"

[wallpaper.monitors.eDP-1]
path = "/home/elisa/Pictures/Wallpapers/wallhaven-po8ow9_2560x1440.png"

[[wallpaper.favorite]]
palette_source = "wallpaper"
path = "/home/elisa/Pictures/Wallpapers/wallhaven-po8ow9_2560x1440.png"
theme_mode = "dark"
wallpaper_scheme = "m3-content"

[widget.launcher]
glyph = "rocket"